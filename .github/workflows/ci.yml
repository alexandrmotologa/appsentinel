name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Verify CLI executable
        run: |
          node ./bin/appsentinel.js --help
          node ./bin/appsentinel.js triage "App crashes immediately on launch on iPhone 15 Pro iOS 17.5"
          node ./bin/appsentinel.js replay --dataset ./examples/sample-reviews.json
